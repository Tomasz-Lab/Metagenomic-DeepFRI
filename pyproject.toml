[project]
name = "mDeepFRI"
version = "1.2.0"
description = "Pipeline for searching and aligning contact maps for proteins, and function prediction with DeepFRI."
readme = { file = "README.md", content-type = "text/markdown" }
license = "BSD-3-Clause"
license-files = [
    "LICENSE"
]
authors = [
    { name = "Valentyn Bezshapkin", email = "valentyn.bezshapkin@micro.biol.ethz.ch" }
]
requires-python = ">=3.11,<3.13"
keywords = ["bioinformatics", "protein", "function", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "click ~=8.0",
    "numpy ~=2.3",
    "biotite >=1.3",
    "pysam >=0.18",
    "pyopal ~=0.7",
    "foldcomp",
    "tqdm",
    "onnxruntime ~=1.26.0",
    "obonet >=0.3",
    "networkx >=2.6",
]

[project.urls]
"Homepage" = "https://github.com/Tomasz-Lab/Metagenomic-DeepFRI"
"Bug Tracker" = "https://github.com/Tomasz-Lab/Metagenomic-DeepFRI/issues"
"Changelog" = "https://github.com/Tomasz-Lab/Metagenomic-DeepFRI/blob/main/CHANGELOG.md"
"Builds" = "https://github.com/Tomasz-Lab/Metagenomic-DeepFRI/actions"
"PyPI" = "https://pypi.org/project/mdeepfri"

[project.optional-dependencies]
dev = [
    "pre-commit"
]
gpu = [
    "onnxruntime-gpu[cuda,cudnn]~=1.26.0; platform_system != 'Darwin' and platform_machine != 'aarch64' and platform_machine != 'arm64'",
]

[project.scripts]
mDeepFRI = "mDeepFRI.cli:main"

[build-system]
requires = [
    "setuptools >= 80",
    "cython ~=3.0",
    "archspec ~=0.2.0",
    "requests",
    "numpy"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mDeepFRI", "mDeepFRI.*"]

[tool.setuptools.package-data]
"mDeepFRI" = ["assets/*.pkl", "assets/*.tsv"]

[tool.ruff]
line-length = 120

[tool.yapf]
based_on_style = "yapf"
spaces_before_comment = 4
split_before_logical_operator = true
column_limit = 120
parallel = true
indent_width = 4
in_place = true
exclude = [
    "tests/",
    "docs/",
    "*.faa",
    "*.pdb"
    ]

[tool.mypy]
exclude = [
    "tests/",
    "docs/"
    ]
